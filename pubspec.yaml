name: swallow_monitor
description: 颈部吞咽事件采集与端侧分类 —— 上位机骨架（录音/波形/记录/分类占位）
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^7.2.0          # 48 kHz PCM16 流式录音
  path_provider: ^2.1.6   # 录音落盘目录
  share_plus: ^13.3.1     # 把 wav 导出给电脑/微信
  file_picker: ^13.4.1    # 选模型包 zip
  archive: ^4.7.1         # 解压模型包

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/spec.default.json
