name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 仓库里不放 android/，现场生成再打补丁（权限 / minSdk / 应用名）
      - name: 生成 Android 工程
        run: |
          set -e
          flutter create --project-name swallow_monitor --org com.example \
            --platforms=android /tmp/app
          cp pubspec.yaml /tmp/app/pubspec.yaml
          cp -r lib/. /tmp/app/lib/
          rm -f /tmp/app/analysis_options.yaml
          rm -rf /tmp/app/test   # 模板自带的 widget_test 引用 MyApp，会编译失败
          python3 tools/prepare_android.py /tmp/app

      - name: 静态检查
        run: |
          cd /tmp/app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 编译 release APK
        run: |
          set -e
          cd /tmp/app
          flutter build apk --release --target-platform android-arm64,android-arm
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/out/swallow-monitor.apk"
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: swallow-monitor-apk
          path: out/swallow-monitor.apk

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/swallow-monitor.apk
